services:
  # Matrix Synapse Homeserver (本地开发用)
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: moltchat-matrix
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - ./data/matrix:/data
    environment:
      - SYNAPSE_SERVER_NAME=moltchat.local
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_NO_TLS=true
    networks:
      - default
      - moltchat_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  moltchat_default:
    external: true
