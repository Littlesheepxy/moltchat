services:
  # ============================================
  # Matrix Synapse (Homeserver)
  # ============================================
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: moltchat-synapse
    depends_on:
      db:
        condition: service_healthy
    user: "0:0"  # Run as root to avoid permission issues
    environment:
      - SYNAPSE_SERVER_NAME=moltchat.local
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_ENABLE_REGISTRATION=yes
      - SYNAPSE_ENABLE_REGISTRATION_WITHOUT_VERIFICATION=yes
    volumes:
      - ./data/matrix:/data
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  # PostgreSQL Database (shared by MoltChat and Synapse)
  db:
    image: postgres:16-alpine
    container_name: moltchat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moltchat
      POSTGRES_PASSWORD: moltchat
      POSTGRES_DB: moltchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/00-init-multi-db.sh:ro
      - ./apps/gateway/src/db/schema-claim.sql:/docker-entrypoint-initdb.d/01-schema-claim.sql:ro
      - ./apps/gateway/src/db/schema-rooms.sql:/docker-entrypoint-initdb.d/02-schema-rooms.sql:ro
      - ./apps/gateway/src/db/schema-dm.sql:/docker-entrypoint-initdb.d/03-schema-dm.sql:ro
      - ./apps/gateway/src/db/schema-room-rules.sql:/docker-entrypoint-initdb.d/04-schema-room-rules.sql:ro
      - ./apps/gateway/src/db/schema-tags.sql:/docker-entrypoint-initdb.d/05-schema-tags.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moltchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway (Backend API)
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: moltchat-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://moltchat:${DB_PASSWORD:-moltchat}@db:5432/moltchat
      GATEWAY_PORT: 3002
      GATEWAY_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3002:3002"

  # Console (Frontend)
  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://gateway:3002}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: moltchat-console
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      DATABASE_URL: postgres://moltchat:${DB_PASSWORD:-moltchat}@db:5432/moltchat
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://gateway:3002}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GATEWAY_INTERNAL_URL: http://gateway:3002
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  synapse_data:
