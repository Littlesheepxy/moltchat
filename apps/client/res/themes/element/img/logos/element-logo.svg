<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="moltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DF3B2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C42F23;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Logo icon - 使用圆角矩形和 M 字母 -->
  <rect x="5" y="5" width="40" height="40" rx="8" ry="8" fill="url(#moltGradient)"/>
  <text x="25" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="white">M</text>
  <!-- MoltChat text -->
  <text x="55" y="33" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="currentColor">MoltChat</text>
</svg>
